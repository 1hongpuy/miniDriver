apiVersion: batch/v1
kind: Job
metadata:
  name: placement-smoke
  namespace: minidriver
  labels:
    app.kubernetes.io/name: minidriver
    app.kubernetes.io/component: benchmark
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minidriver
        app.kubernetes.io/component: benchmark
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: minidriver-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: prepare-work-directory
          image: minidriver:4.0-ha-k3s
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - mkdir -p /work/placement-smoke && chown -R 10001:10001 /work/placement-smoke
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: work
              mountPath: /work
      containers:
        - name: benchmark
          image: minidriver:4.0-ha-k3s
          imagePullPolicy: Never
          command: ["/usr/local/bin/minikv_v2_bench"]
          args:
            - local
            - --gateway
            - gateway.minidriver.svc.cluster.local:18280
            - --work-dir
            - /work/placement-smoke
            - --sizes
            - 64KiB
            - --runs
            - "1"
            - --warmup-seconds
            - "5"
            - --duration-seconds
            - "60"
            - --concurrency
            - "1"
            - --chunk-window
            - "1"
            - --global-chunk-budget
            - "2"
            - --upload-checksum
            - crc32c
            - --mode
            - upload
            - --connection-mode
            - keep-alive
            - --requests-per-worker
            - "1"
            - --remote-dir
            - /k3s-placement-smoke
          env:
            - name: MINIKV_METADATA_MODE
              value: raft
            - name: MINIKV_V2_CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-secret
                  key: cluster-secret
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          hostPath:
            path: /var/lib/minidriver-bench
            type: DirectoryOrCreate
