apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: minidriver
    app.kubernetes.io/component: gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: minidriver
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 18280
      targetPort: gateway-http
      nodePort: 30280
      protocol: TCP
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: minidriver
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: minidriver-ha
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minidriver
      app.kubernetes.io/component: gateway
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minidriver
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: minidriver-ha
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [minidriver-1, minidriver-2, minidriver-3]
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: minidriver:4.0-ha-k3s
          imagePullPolicy: Never
          command: ["/usr/local/bin/minikv_v2_gateway"]
          args: ["18281", "/var/lib/minidriver/gateway"]
          env:
            - name: MINIKV_GATEWAY_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MINIKV_V2_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MINIKV_METADATA_MODE
              value: raft
            - name: MINIKV_METADATA_ENDPOINTS
              value: "192.168.137.10:18101,192.168.137.148:18101,192.168.137.151:18101"
            - name: MINIKV_V3_REPLICATION_FACTOR
              value: "2"
            - name: MINIKV_V3_IDENTITY_SCHEME
              value: opaque-chunk-id
            - name: MINIKV_V3_CHECKSUM_TYPE
              value: crc32c
            - name: MINIKV_GATEWAY_AI_OUTBOX_ENABLED
              value: "0"
            - name: MINIKV_V2_CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-secret
                  key: cluster-secret
            - name: MINIKV_LOG_LEVEL
              value: info
          ports:
            - name: gateway-http
              containerPort: 18281
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: gateway-http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /storage-readyz
              port: gateway-http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: gateway-http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: gateway-data
              mountPath: /var/lib/minidriver/gateway
      volumes:
        - name: gateway-data
          emptyDir:
            sizeLimit: 2Gi

