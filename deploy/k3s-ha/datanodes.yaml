apiVersion: apps/v1
kind: Deployment
metadata:
  name: datanode-1
  labels: &datanodeLabels
    app.kubernetes.io/name: minidriver
    app.kubernetes.io/component: datanode
    app.kubernetes.io/part-of: minidriver-ha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minidriver
      app.kubernetes.io/component: datanode
      minidriver.io/node-id: dn-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minidriver
        app.kubernetes.io/component: datanode
        app.kubernetes.io/part-of: minidriver-ha
        minidriver.io/node-id: dn-1
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: minidriver-1
      terminationGracePeriodSeconds: 30
      securityContext: &datanodePodSecurity
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: datanode
          image: minidriver:4.0-ha-k3s
          imagePullPolicy: Never
          command: ["/usr/local/bin/minikv_v2_datanode"]
          args: ["dn-1", "192.168.137.10", "19201", "/var/lib/minidriver/datanode", "127.0.0.1", "18281"]
          env: &datanodeCommonEnv
            - name: MINIKV_DATANODE_METADATA_ENDPOINTS
              value: "192.168.137.10:18101,192.168.137.148:18101,192.168.137.151:18101"
            - name: MINIKV_V3_PHYSICAL_INDEX_DIR
              value: /var/lib/minidriver/datanode-index
            - name: MINIKV_V3_IDENTITY_SCHEME
              value: opaque-chunk-id
            - name: MINIKV_V3_CHECKSUM_TYPE
              value: crc32c
            - name: MINIKV_V3_DURABILITY_MODE
              value: group_commit
            - name: MINIKV_V3_GROUP_COMMIT_BYTES
              value: "8388608"
            - name: MINIKV_V3_GROUP_COMMIT_ITEMS
              value: "8"
            - name: MINIKV_V3_GROUP_COMMIT_DELAY_US
              value: "2000"
            - name: MINIKV_V3_GROUP_COMMIT_MAX_PENDING_BYTES
              value: "67108864"
            - name: MINIKV_V3_GROUP_COMMIT_MAX_PENDING_ITEMS
              value: "64"
            - name: MINIKV_V4_MAX_ACTIVE_UPLOADS
              value: "2"
            - name: MINIKV_V4_MAX_ACTIVE_DOWNLOADS
              value: "8"
            - name: MINIKV_V4_MAX_UPLOADS_PER_CLIENT
              value: "2"
            - name: MINIKV_V4_MAX_DOWNLOADS_PER_CLIENT
              value: "4"
            - name: MINIKV_V4_IO_THREADS
              value: "2"
            - name: MINIKV_V4_DISK_WRITE_WORKERS
              value: "2"
            - name: MINIKV_V2_CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: cluster-secret
                  key: cluster-secret
            - name: MINIKV_LOG_LEVEL
              value: info
          ports:
            - name: datanode-http
              containerPort: 19201
              protocol: TCP
          startupProbe: &datanodeStartupProbe
            httpGet:
              path: /readyz
              port: datanode-http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe: &datanodeReadinessProbe
            httpGet:
              path: /readyz
              port: datanode-http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 5
          livenessProbe: &datanodeLivenessProbe
            httpGet:
              path: /healthz
              port: datanode-http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          resources: &datanodeResources
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext: &datanodeContainerSecurity
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: datanode-data
              mountPath: /var/lib/minidriver/datanode
            - name: datanode-index
              mountPath: /var/lib/minidriver/datanode-index
      volumes:
        - name: datanode-data
          hostPath:
            path: /var/lib/minidriver-data/dn-1
            type: Directory
        - name: datanode-index
          hostPath:
            path: /var/lib/minidriver-index/dn-1
            type: Directory
---
